# CI for the RISC-V emulator.
#
# Three tiers, each a separate job:
#   1. build     -- build the Ada emulator + run the Ada unit tests   (blocking)
#   2. programs  -- build the C test programs + run the 2263-assertion suite
#   3. compliance-- riscv-arch-test and riscv-tests, gated on a pass-count
#                   baseline (these suites have KNOWN, by-design deviations,
#                   so we check "no regression below baseline", not exit code)
#
# Toolchain split: the Ada build needs GNAT 10 (the build uses -gnatwae, and a
# newer GNAT flags new warnings), while the cross toolchain needs a recent gcc
# for the bit-manip / crypto extensions. So `build` runs on 22.04 with gnat-10
# and uploads the binary as an artifact; jobs 2 and 3 download that binary and
# only add a recent RISC-V gcc -- the two toolchains never share an image.

name: CI

on:
  push:
  pull_request:

jobs:
  # --- Tier 1: Ada build + unit tests (must pass) ------------------------
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GNAT 10
        run: sudo apt-get update && sudo apt-get install -y gnat-10 make

      - name: Build emulator
        run: make GNATMAKE=gnatmake-10

      - name: Ada unit tests
        run: make test GNATMAKE=gnatmake-10

      - name: Upload emulator binary
        uses: actions/upload-artifact@v4
        with:
          name: riscv_emulator
          path: bin/riscv_emulator
          retention-days: 7

  # --- Tier 2: bare-metal C program suite --------------------------------
  programs:
    needs: build
    runs-on: ubuntu-latest
    env:
      CROSS: riscv64-unknown-elf-      # apt toolchain uses the riscv64 prefix
    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf make

      - name: Fetch emulator binary
        uses: actions/download-artifact@v4
        with:
          name: riscv_emulator
          path: bin
      - run: chmod +x bin/riscv_emulator

      - name: Build test programs
        run: make -C programs all

      - name: Run program suite (expects 0 FAIL)
        run: bash programs/test-all.sh

  # --- Tier 3: architecture compliance (baseline-gated) ------------------
  compliance:
    needs: build
    runs-on: ubuntu-latest
    env:
      RISCV_PREFIX: riscv64-unknown-elf         # for arch-test/run_arch_tests.sh
      RISCV_CC: riscv64-unknown-elf-gcc         # for run-riscv-tests.sh
      RISCV_NM: riscv64-unknown-elf-nm
      # Baselines: the current known-good pass counts. Bump these ONLY when a
      # real improvement raises them; a drop below is a regression and fails CI.
      ARCH_MIN_PASS: "291"                      # arch-test 'all' (of 300)
      RISCV_TESTS_MIN_PASS: "284"               # riscv-tests   (of 293)
      # Pinned to the revision the 284 baseline was measured against; bump
      # deliberately alongside RISCV_TESTS_MIN_PASS.
      RISCV_TESTS_REF: "34e6b6d1e7936b526075432fb730d89148623484"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive                 # brings in arch-test/riscv-arch-test

      - name: Install RISC-V cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf make

      - name: Fetch emulator binary
        uses: actions/download-artifact@v4
        with:
          name: riscv_emulator
          path: bin
      - run: chmod +x bin/riscv_emulator

      - name: riscv-arch-test (all suites, baseline-gated)
        run: |
          set -o pipefail
          out=$(bash arch-test/run_arch_tests.sh all || true)
          echo "$out"
          pass=$(echo "$out" | grep -E '^\s*TOTAL' | grep -oE 'Pass:\s*[0-9]+' | grep -oE '[0-9]+' | tail -1)
          echo "arch-test pass=$pass  baseline=$ARCH_MIN_PASS"
          test -n "$pass" && [ "$pass" -ge "$ARCH_MIN_PASS" ]

      - name: riscv-tests (baseline-gated)
        run: |
          set -o pipefail
          git clone https://github.com/riscv-software-src/riscv-tests.git programs/riscv-tests
          git -C programs/riscv-tests checkout --quiet "$RISCV_TESTS_REF"
          # run-riscv-tests.sh needs env/p (link.ld + macros), which is a
          # submodule of riscv-tests -- fetch it or every build fails.
          git -C programs/riscv-tests submodule update --init --recursive
          out=$(bash programs/run-riscv-tests.sh || true)
          echo "$out"
          pass=$(echo "$out" | grep -E '^TOTAL' | awk '{print $3}' | tail -1)
          echo "riscv-tests pass=$pass  baseline=$RISCV_TESTS_MIN_PASS"
          test -n "$pass" && [ "$pass" -ge "$RISCV_TESTS_MIN_PASS" ]
