# Generic embedded profile
# Small memory, typical for microcontrollers

[profile]
name = embedded

[memory.flash]
base = 0x0
size = 0x20000
type = rom

[memory.ram]
base = 0x20000000
size = 0x8000
type = ram

[peripheral.uart0]
type = uart16550
base = 0x40000000

[cpu]
reset_vector = 0x0
stack_init = 0x20008000
vlen = 128
