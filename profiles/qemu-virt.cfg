# QEMU virt machine profile
# Compatible with QEMU's -machine virt configuration

[profile]
name = qemu-virt

[memory.ram]
base = 0x80000000
size = 0x8000000
type = ram

[memory.rom]
base = 0x1000
size = 0x10000
type = rom

[peripheral.uart0]
type = uart16550
base = 0x10000000

[peripheral.clint]
type = clint
base = 0x02000000

[cpu]
reset_vector = 0x80000000
stack_init = 0x88000000
vlen = 128
